[package]
name = "PakePlus"
version = "2.2.8"
description = "Turn any webpage into a desktop app and mobile app with Rust."
authors = ["1024xiaoshen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pakeplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png", "image-ico", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
tokio = { version = "1", features = ["full"] }
warp = "0.3"
zip = "4.1.0"
walkdir = "2.5.0"
futures = "0.3.31"
encoding_rs = "0.8"
tauri-plugin-os = "2.0.0"
tauri-plugin-fs = { version = "2.4.5", features = ["watch"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-http = { version = "2.2.0", features = ["unsafe-headers"] }
tauri-plugin-clipboard-manager = "2.0.0"
tauri-plugin-store = "2.0.0"
tauri-plugin-process = "2"
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
# Used to open urls, files and the preview with the system browser on mobile platforms.
tauri-plugin-opener = "2"
# Used to display notifications on mobile platforms, `notify-rust` is desktop only.
tauri-plugin-notification = "2"

# Desktop only dependencies.
#
# Android and iOS do not provide the primitives these crates rely on
# (a shell, the executable on disk and the freedesktop notification daemon),
# the mobile implementations live in `src/utils/mobile.rs` instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = "5.3.2"
notify-rust = "4.11.7"
machine-uid = "0.5.3"
