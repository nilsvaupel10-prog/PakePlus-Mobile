name: Android Build

on:
    workflow_dispatch:
    push:
        tags:
            - 'android-v*'

jobs:
    desktop-check:
        name: Rust check (linux desktop)
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install desktop dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Rust static check (desktop target)
              working-directory: src-tauri
              run: cargo check

    android-check:
        name: Rust check (aarch64-linux-android)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Install Android NDK
              run: |
                  sdkmanager --install "ndk;26.3.11579264"
                  echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

            - name: Install Rust stable with Android target
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android

            - name: Rust static check (Android target)
              working-directory: src-tauri
              env:
                  CC_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
                  AR_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
              run: cargo check --target aarch64-linux-android

    build-apk:
        name: Build Android APK
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: android-check
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Install Android NDK
              run: |
                  sdkmanager --install "ndk;26.3.11579264"
                  echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

            - uses: pnpm/action-setup@v3
              with:
                  version: latest

            - name: Sync node version and setup cache
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install Rust stable with Android targets
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

            - name: Install frontend dependencies
              run: pnpm install

            - name: Generate Android project shell
              run: pnpm exec tauri android init --ci

            - name: Build debug APK (aarch64)
              run: pnpm exec tauri android build --apk --debug --target aarch64

            - name: Collect APK
              run: |
                  find gen/android/app/build/outputs/apk -name '*.apk'
                  mkdir -p apk-out
                  find gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} apk-out/ \;

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: PakePlus-android-debug-apk
                  path: apk-out/*.apk

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/android-v')
              uses: softprops/action-gh-release@v2
              with:
                  files: apk-out/*.apk
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
